[project]
name = "moneymoodai"
version = "0.1.0"
description = "MoneyMood AI backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.0",
    "yfinance==0.2.66",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "GoogleNews==1.6.15",
    "apscheduler>=3.11.0",
    "cachetools>=6.0.0"
]

# Vercel autodetects app.py (the legacy Streamlit dashboard) and finds no
# FastAPI instance there. Point it at the real API instead.
[tool.vercel]
entrypoint = "api:app"
